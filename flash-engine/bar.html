<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root { --bg: #f1f2f4; --text: #1d1e21; --muted: #5f636b; --hover: #dfe1e6; --border: #d3d5da; --brand: #ff6a3d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #26272b; --text: #e8e9eb; --muted: #9da0a8; --hover: #34363c; --border: #3a3d44; } }
  * { box-sizing: border-box; }
  body { margin: 0; height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--bg);
         border-bottom: 1px solid var(--border); color: var(--text); font: 13px system-ui, -apple-system, sans-serif; user-select: none; }
  button { font: inherit; color: var(--text); background: none; border: 1px solid transparent; border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: var(--hover); }
  #off { border-color: var(--brand); }
  #host { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); padding: 0 6px; }
</style>
</head>
<body>
  <button id="reload" title="Tải lại">⟳</button>
  <span id="host"></span>
  <button id="ruffle" title="Mở bằng Ruffle (giả lập; game online cần socket không chạy)">Dùng Ruffle</button>
  <button id="off" title="Bỏ trang này khỏi danh sách Flash, mở như web thường ở cửa sổ chính">Tắt Flash</button>
<script>
  const $ = (id) => document.getElementById(id);
  $('reload').onclick = () => window.wbar.send('reload');
  $('ruffle').onclick = () => window.wbar.send('ruffle');
  $('off').onclick = () => window.wbar.send('off');
  window.wbar.onHost((h) => { $('host').textContent = h; });
</script>
</body>
</html>
