<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lịch sử</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root {
    --bg: #1b1c1f; --card: #232428; --hover: #2c2e33; --border: #33363c; --field: #141517;
    --text: #e8e9eb; --muted: #9da0a8; --faint: #70747c;
    --brand: #ff6a3d; --blue: #4c8dff; --red: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px system-ui, -apple-system, sans-serif; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  header { position: sticky; top: 0; z-index: 1; background: rgba(27,28,31,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .head { max-width: 880px; margin: 0 auto; padding: 18px 20px 16px; display: flex; gap: 12px; align-items: center; }
  .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(76,141,255,.16); color: var(--blue); }
  .logo svg { width: 18px; height: 18px; }
  h1 { margin: 0; font-size: 20px; font-weight: 650; }
  .count { color: var(--faint); font-size: 12.5px; margin-left: 2px; margin-right: auto; }
  .search { position: relative; }
  .search svg { position: absolute; left: 11px; top: 9px; color: var(--faint); }
  input { width: 300px; max-width: 40vw; height: 34px; border: 1px solid var(--border); border-radius: 17px; background: var(--field);
          color: var(--text); padding: 0 14px 0 34px; font-size: 14px; outline: none; transition: border-color .12s, box-shadow .12s; }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255,106,61,.2); }
  input::-webkit-search-cancel-button { filter: invert(.6); }
  button { font: inherit; cursor: pointer; }
  #clear { height: 34px; display: flex; align-items: center; gap: 7px; border: 1px solid rgba(248,81,73,.45); border-radius: 17px;
           background: rgba(248,81,73,.08); color: #ff9b94; font-size: 13px; padding: 0 14px; }
  #clear:hover { background: rgba(248,81,73,.18); color: #ffc2bd; }
  main { max-width: 880px; margin: 0 auto; padding: 6px 20px 48px; }
  .day { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 6px; margin-top: 16px; }
  h2 { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 6px 10px 6px; }
  h2::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #5b5e66; }
  h2.today::before { background: var(--blue); box-shadow: 0 0 0 3px rgba(76,141,255,.2); }
  h2.today { color: #b9d0ff; }
  .row { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 6px 0 10px; border-radius: 8px; }
  .row:hover { background: var(--hover); }
  .time { flex: none; width: 42px; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .av { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
  a { flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text);
      text-decoration: none; cursor: pointer; }
  a:hover { color: #fff; text-decoration: underline; text-decoration-color: rgba(255,255,255,.35); text-underline-offset: 3px; }
  .host { flex: 1 1 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--faint); font-size: 12px; }
  .del { flex: none; width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--faint);
         display: grid; place-items: center; opacity: 0; transition: opacity .1s; }
  .del svg { width: 14px; height: 14px; }
  .row:hover .del { opacity: 1; }
  .del:hover { background: rgba(248,81,73,.16); color: var(--red); }
  mark { background: rgba(255,106,61,.28); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { text-align: center; color: var(--muted); margin-top: 80px; }
  .empty svg { width: 40px; height: 40px; color: #44474f; display: block; margin: 0 auto 12px; }
  #more { display: block; margin: 20px auto 0; height: 34px; border: 1px solid var(--border); border-radius: 17px; background: var(--card);
          color: var(--text); padding: 0 16px; }
  #more:hover { background: var(--hover); }
</style>
</head>
<body>
<header>
  <div class="head">
    <span class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
    <h1>Lịch sử</h1><span class="count" id="count"></span>
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Tìm trong lịch sử" spellcheck="false" autofocus></label>
    <button id="clear"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Xoá lịch sử…</button>
  </div>
</header>
<main id="list"></main>
<script>
  const $ = (id) => document.getElementById(id);
  const PAGE = 300;
  let all = [];
  let limit = PAGE;

  function dayLabel(ts) {
    const d = new Date(ts); d.setHours(0, 0, 0, 0);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((today - d) / 86400000);
    const full = d.toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'numeric', year: 'numeric' });
    return diff === 0 ? 'Hôm nay — ' + full : diff === 1 ? 'Hôm qua — ' + full : full;
  }
  const AV_COLORS = ['#4c8dff', '#3fb950', '#a371f7', '#e3a008', '#2bb3a3', '#e05fa8', '#ff6a3d', '#7c83ff'];
  const hash = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
  // tô sáng chữ đang tìm (dựng bằng node, không dùng innerHTML vì tiêu đề trang là dữ liệu ngoài)
  function highlight(el, text, q) {
    const i = q ? text.toLowerCase().indexOf(q) : -1;
    if (i < 0) { el.textContent = text; return; }
    const m = document.createElement('mark'); m.textContent = text.slice(i, i + q.length);
    el.append(text.slice(0, i), m, text.slice(i + q.length));
  }
  function hostOf(u) { try { const x = new URL(u); return x.protocol === 'file:' ? 'file' : x.host; } catch { return ''; } }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const items = q ? all.filter(h => (h.title || '').toLowerCase().includes(q) || h.url.toLowerCase().includes(q)) : all;
    const box = $('list');
    box.textContent = '';
    $('count').textContent = all.length ? (q ? `${items.length} / ${all.length} trang` : `${all.length} trang`) : '';
    if (!items.length) {
      const p = document.createElement('div'); p.className = 'empty';
      p.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
      p.append(q ? 'Không tìm thấy trang nào.' : 'Chưa có lịch sử.');
      box.appendChild(p);
      return;
    }
    let lastDay = '', group = null;
    for (const h of items.slice(0, limit)) {
      const day = dayLabel(h.time);
      if (day !== lastDay) {
        group = document.createElement('section'); group.className = 'day';
        const h2 = document.createElement('h2'); h2.textContent = day;
        if (day.startsWith('Hôm nay')) h2.className = 'today';
        group.appendChild(h2); box.appendChild(group);
        lastDay = day;
      }
      const row = document.createElement('div'); row.className = 'row';
      const time = document.createElement('span'); time.className = 'time';
      time.textContent = new Date(h.time).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      const host = hostOf(h.url).replace(/^www\./, '');
      const av = document.createElement('span'); av.className = 'av';
      av.textContent = (host[0] || '?').toUpperCase();
      av.style.background = AV_COLORS[hash(host) % AV_COLORS.length];
      const a = document.createElement('a');
      highlight(a, h.title || h.url, q);
      a.title = h.url;
      // Bấm: mở ở tab này. Cmd+bấm hoặc chuột giữa: mở tab mới
      a.onclick = (e) => { e.preventDefault(); wispHistory.open(h.url, e.metaKey || e.ctrlKey); };
      a.onauxclick = (e) => { if (e.button === 1) { e.preventDefault(); wispHistory.open(h.url, true); } };
      const hs = document.createElement('span'); hs.className = 'host'; highlight(hs, host, q);
      const del = document.createElement('button'); del.className = 'del'; del.title = 'Xoá khỏi lịch sử';
      del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>';
      del.onclick = () => wispHistory.remove([h.id]);
      row.append(time, av, a, hs, del);
      group.appendChild(row);
    }
    if (items.length > limit) {
      const more = document.createElement('button'); more.id = 'more';
      more.textContent = `Hiện thêm (${items.length - limit} trang nữa)`;
      more.onclick = () => { limit += PAGE; render(); };
      box.appendChild(more);
    }
  }

  async function load() { all = await wispHistory.list(); render(); }

  $('q').oninput = () => { limit = PAGE; render(); };
  $('clear').onclick = () => wispHistory.clear();
  wispHistory.onChange(load);
  load();
</script>
</body>
</html>
