<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Dấu trang</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src http: https: data:">
<style>
  :root { --bg: #232428; --hover: #36383d; --border: #3a3d45; --text: #e8e9eb; --muted: #9da0a8; --faint: #70747c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 12.5px system-ui, -apple-system, sans-serif; overflow: hidden; user-select: none; }
  #app { padding: 4px; }
  #list { max-height: 420px; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: inherit; font: inherit; text-align: left; cursor: default; }
  .row:hover, .row:focus-visible { background: var(--hover); outline: none; }
  .row .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .fav, .av { flex: none; width: 16px; height: 16px; border-radius: 3px; }
  .fav { object-fit: contain; }
  .av { display: grid; place-items: center; font-size: 9.5px; font-weight: 700; color: #fff; }
  .manage { color: var(--muted); }
  .manage svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 4px 6px; }
  .empty { color: var(--faint); padding: 8px 10px; }
  [hidden] { display: none !important; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #4a4d55; border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <button class="row manage" id="manage" hidden><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span class="t">Mở trang quản lý dấu trang</span></button>
  <hr id="sep" hidden>
  <div id="list"></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const AV_COLORS = ['#4c8dff', '#3fb950', '#a371f7', '#e3a008', '#2bb3a3', '#e05fa8', '#ff6a3d', '#7c83ff'];
  const hostOf = (u) => { try { return new URL(u).host.replace(/^www\./, ''); } catch { return ''; } };
  let lastH = 0;
  const fit = () => { const h = $('app').offsetHeight; if (h && h !== lastH) { lastH = h; wlist.size(h); } };
  new ResizeObserver(fit).observe($('app'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
  $('manage').onclick = () => wlist.manage();

  function letter(host) {
    const av = document.createElement('span'); av.className = 'av'; av.textContent = (host[0] || '?').toUpperCase();
    let h = 0; for (const c of host) h = (h * 31 + c.charCodeAt(0)) | 0;
    av.style.background = AV_COLORS[Math.abs(h) % AV_COLORS.length];
    return av;
  }
  function icon(b, host) {
    let guess = ''; try { guess = new URL(b.url).origin + '/favicon.ico'; } catch {}
    if (!b.icon && !guess) return letter(host);
    const img = document.createElement('img'); img.className = 'fav'; img.src = b.icon || guess; img.draggable = false;
    img.onload = () => { if (img.naturalWidth < 2) img.replaceWith(letter(host)); };
    img.onerror = () => { if (guess && img.src !== guess) img.src = guess; else img.replaceWith(letter(host)); };
    return img;
  }
  function row(b) {
    const host = hostOf(b.url);
    const el = document.createElement('button'); el.className = 'row'; el.title = b.url;
    const t = document.createElement('span'); t.className = 't'; t.textContent = b.title || host || b.url;
    el.append(icon(b, host), t);
    el.onclick = (e) => wlist.open(b.id, e.metaKey || e.ctrlKey);
    el.onauxclick = (e) => { if (e.button === 1) { e.preventDefault(); wlist.open(b.id, true); } };
    return el;
  }
  wlist.get().then((v) => {
    if (!v) return;
    $('manage').hidden = !v.all; $('sep').hidden = !v.all;
    const box = $('list');
    if (!v.items.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Chưa có dấu trang nào.'; box.appendChild(d); }
    for (const b of v.items) box.appendChild(row(b));
    fit();
  });
</script>
</body>
</html>
