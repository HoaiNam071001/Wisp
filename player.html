<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Flash</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  embed { display: block; width: 100%; height: 100%; }
  .err { color: #ccc; font: 14px system-ui, sans-serif; padding: 24px; }
</style>
</head>
<body>
<script>
  // Trang bọc file .swf: <embed> chạy bằng Flash Player thật
  const src = new URLSearchParams(location.search).get('src');
  if (!src) {
    document.body.innerHTML = '<p class="err">Thiếu tham số ?src=…swf</p>';
  } else {
    document.title = decodeURIComponent(src.split(/[\\/]/).pop().split('?')[0]);
    const e = document.createElement('embed');
    e.setAttribute('type', 'application/x-shockwave-flash');
    e.setAttribute('src', src);
    e.setAttribute('quality', 'high');
    e.setAttribute('allowscriptaccess', 'always');
    e.setAttribute('allowfullscreen', 'true');
    e.setAttribute('allownetworking', 'all');
    e.setAttribute('wmode', 'direct');
    document.body.appendChild(e);
  }
</script>
</body>
</html>
